<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Página não encontrada — Phil Team Jiu Jitsu</title>
<meta name="robots" content="noindex, follow">
<style>
  :root { --g:#78FF70; --bk:#060606; --w:#fff; }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bk); color:var(--w);
    font-family:"Arial",sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:2rem;
  }
  .code {
    font-size:clamp(80px,20vw,180px); font-weight:900;
    color:var(--g); line-height:1; letter-spacing:-4px;
  }
  h1 { font-size:clamp(20px,4vw,36px); font-weight:700;
       text-transform:uppercase; letter-spacing:3px; margin:16px 0; }
  p  { color:rgba(255,255,255,.5); font-size:14px;
       letter-spacing:1px; max-width:400px; line-height:1.8; margin-bottom:40px; }
  a.btn {
    display:inline-block; background:var(--g); color:var(--bk);
    padding:14px 36px; font-weight:700; text-decoration:none;
    text-transform:uppercase; letter-spacing:4px; font-size:14px;
    transition:background .2s;
  }
  a.btn:hover { background:var(--w); }
</style>
</head>
<body>
  <div class="code">404</div>
  <h1>Página não encontrada</h1>
  <p>A página que você procura não existe ou foi movida.<br>
     Volte para o início e continue explorando.</p>
  <a href="/" class="btn">Voltar ao início</a>
</body>
</html>
